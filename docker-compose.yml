version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nutriplan-db
    environment:
      POSTGRES_USER: nutriplan
      POSTGRES_PASSWORD: nutriplan123
      POSTGRES_DB: nutriplan
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nutriplan']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: nutriplan-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://nutriplan:nutriplan123@postgres:5432/nutriplan?schema=public
      JWT_SECRET: nutriplan-super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 3000
    ports:
      - '3000:3000'

volumes:
  postgres_data:
