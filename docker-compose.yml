version: '3.8'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: nutriplan-api
    environment:
      PORT: 3000
      JWT_SECRET: nutriplan-super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 30d
      NODE_ENV: production
    ports:
      - '3000:3000'
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: nutriplan-web
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - '5173:80'
    depends_on:
      - api
    restart: unless-stopped
