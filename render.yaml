services:
  # Backend NestJS
  - type: web
    name: nutriplan-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true

  # Frontend React (Vite)
  - type: web
    name: nutriplan-web
    runtime: static
    plan: free
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
